# where audio plugins are, for every app in the desktop session. fedora puts them in
# /usr/lib64, which hosts built elsewhere (reaper, bitwig) don't look in. vst3, clap
# and vst2 are linked into /usr/lib instead (see build.sh); lv2, ladspa and dssi
# can't be, so their search paths are set here
LV2_PATH=${HOME}/.lv2:/usr/local/lib64/lv2:/usr/local/lib/lv2:/usr/lib64/lv2:/usr/lib/lv2
LADSPA_PATH=${HOME}/.ladspa:/usr/local/lib64/ladspa:/usr/local/lib/ladspa:/usr/lib64/ladspa:/usr/lib/ladspa
DSSI_PATH=${HOME}/.dssi:/usr/local/lib64/dssi:/usr/local/lib/dssi:/usr/lib64/dssi:/usr/lib/dssi
